name: CI

# Lint, type check, tests, the Home Assistant and HACS validators, a dependency
# audit, a secret scan, a workflow lint, the release bookkeeping check and the
# coverage signals. Replaces ruff.yaml, mypy.yaml, hassfest.yaml and hacs.yaml. The
# documentation-impact check is its own workflow (docs-impact.yml) because it must
# also run when a pull request description is edited.
#
# The `name:` of every job below is the status-check name that branch protection
# will require (docs/governance.md in the playbook). Rename one only together
# with the branch protection list, or every pull request stays blocked, and with
# REQUIRED in scripts/release_preflight.py (a test checks the latter), or every
# release stays blocked.
#
# There is deliberately no `schedule:` here. GitHub disables a scheduled
# workflow after 60 days without repository activity, and a disabled workflow
# stops running on pull requests too: that is what happened to the old hacs and
# hassfest workflows.
on:
  pull_request: {}
  push:
    branches: [main]

# On main every push has a group of its own: a group keeps one pending run and cancels the older pending ones, and a
# cancelled run of a commit that bumped the version would never release it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Matches pytest-homeassistant-custom-component in requirements_test.txt (it
  # pins the Home Assistant release, and with it the minimum Python). The
  # integration itself must stay valid for Home Assistant 2026.1 (Python 3.13).
  PYTHON_VERSION: "3.14"

jobs:
  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff (hash-locked in .github/locks)
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r .github/locks/ruff.txt
      # The rules are listed in pyproject.toml, so a ruff upgrade cannot add rules.
      - name: ruff check
        run: ruff check .

  mypy:
    name: Type check (mypy)
    # Pinned, not ubuntu-latest: this job installs the whole Home Assistant tree,
    # and ubuntu-latest moves to Ubuntu 26 from 2026-10-19, where some of those
    # packages build from source. Move it with the Python and Home Assistant bump.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/locks/test.txt
      # Home Assistant comes with the pytest plugin; without it every Home
      # Assistant import is `Any` and mypy checks nothing.
      - name: Install the hash-locked test requirements
        run: python -m pip install --require-hashes -r .github/locks/test.txt
      # An exact baseline, not a count: .github/mypy-baseline.txt lists the known
      # diagnostics, and scripts/check_mypy_baseline.py fails on a new one, on an entry
      # mypy no longer reports, and when mypy cannot run. Contributors run the same
      # script locally. (The old workflow ran without Home Assistant installed, so every
      # Home Assistant type was `Any` and it reported nothing.)
      - name: mypy
        run: python scripts/check_mypy_baseline.py

  tests:
    name: Tests (pytest)
    # Pinned for the same reason as the mypy job: it installs the Home Assistant tree.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/locks/test.txt
      - name: Install the hash-locked test requirements
        run: python -m pip install --require-hashes -r .github/locks/test.txt
      # pytest-socket (part of the plugin) blocks real network access, so the suite
      # cannot reach the City of Warsaw API or leak a key.
      - name: pytest
        run: pytest --cov --cov-report=xml --junitxml=junit.xml
      - name: Keep the coverage and test reports for the coverage-signals job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          retention-days: 7
          if-no-files-found: error

  # Signals, not gates: this job is deliberately NOT a required status check and
  # nothing in it can fail the Tests (pytest) job above. It only reports where the
  # tests stand (Codecov: coverage of the diff; SonarCloud: coverage plus code
  # smells and duplication). Pull requests from forks and from Dependabot cannot
  # read repository secrets, so each step skips itself when its token is empty. A
  # step's own `env:` is evaluated before its `if:`, which is what makes that work.
  # SonarCloud's Automatic Analysis must stay OFF for the project (Administration >
  # Analysis Method), or the CI-based scan below fails; sonar-project.properties
  # explains why.
  coverage-signals:
    name: Coverage signals (Codecov, SonarCloud)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The scan attributes new versus existing code by git blame: it needs
          # the full history, not the default shallow clone.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: test-reports
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          # A Codecov outage must not turn a signal into a failure.
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1.2.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: junit.xml
      # CI-based analysis (sonar-project.properties), not SonarCloud's Automatic
      # Analysis; the two are mutually exclusive.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Pinned to a commit of the default branch (the repository has no recent
      # release). The trailing comment is deliberately not a branch name and not a
      # date: zizmor's ref-version-mismatch audit fails as soon as a named branch
      # moves past the pin, and Dependabot bumps the SHA without touching the
      # comment, so a date would go stale. Prefer a commit at least 7 days old when
      # bumping by hand. The wrapper starts the ghcr.io/home-assistant/hassfest
      # image, which this pin does not freeze.
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6  # default branch

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit of the default branch (the last release is from 2022);
      # see the hassfest job for why the comment is not a branch name or a date.
      # The wrapper starts the ghcr.io/hacs/action:main image, which this pin does
      # not freeze. The validator fetches brand assets
      # from brands.home-assistant.io, so a run can fail on a network error alone:
      # re-run the job before suspecting the change, and do not require this check.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # default branch
        with:
          category: integration

  compat-min:
    name: Compat smoke (minimum Home Assistant)
    # The integration claims Home Assistant 2026.1 (hacs.json) and Python 3.13; every other job runs
    # the newest release. Not required to merge, but a release needs it: see REQUIRED in
    # scripts/release_preflight.py. The test plugin of that release pins it, so the whole suite runs
    # there, not only tests/compat. To move the minimum, edit .github/compat/ together with hacs.json
    # and CHANGELOG.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the oldest supported Home Assistant and its test plugin
        run: python -m pip install --require-hashes -r .github/locks/min-ha.txt
      - name: Run the tests on the oldest supported Home Assistant
        run: python -m pytest tests -p no:cacheprovider

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit (hash-locked in .github/locks)
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r .github/locks/pip-audit.txt
      # Audits the exact pins of the test tooling. Home Assistant's own transitive
      # dependencies are deliberately not gated: they are pinned by the plugin, a
      # vulnerable one cannot be fixed from this repository, and gating on them
      # makes every unrelated pull request red. The integration itself ships no
      # dependencies of its own. A green result therefore says nothing about the
      # Home Assistant release the tooling runs against: that one is bumped by hand
      # (Dependabot ignores the plugin), together with the Python version.
      - name: pip-audit
        run: pip-audit -r requirements_test.txt --no-deps --disable-pip --strict

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # From the release's own gitleaks_<version>_checksums.txt. Update it with the version.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Compute scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          else
            # First push, or a force push whose previous tip is no longer in the
            # clone: the new commits cannot be listed, so scan all reachable history.
            range="HEAD"
          fi
          # gitleaks reports "0 commits scanned, no leaks found" and exits 0 for a
          # range git cannot resolve. Fail here instead of passing a scan of nothing.
          git log --format=%H "$range" > /dev/null
          echo "range=${range}" >> "$GITHUB_OUTPUT"

      # Scoped to this run's commits, not the whole history: a full-history scan
      # re-reports old, already-rotated findings on every pull request.
      - name: gitleaks
        env:
          SCAN_RANGE: ${{ steps.range.outputs.range }}
        run: gitleaks git --log-opts="$SCAN_RANGE" --exit-code 1 .

  workflow-lint:
    name: Lint workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # From the release's own actionlint_<version>_checksums.txt. Update it with the version.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          echo "$PWD" >> "$GITHUB_PATH"

      - name: actionlint
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | xargs -0 actionlint

      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e  # v0.7.1
        with:
          version: v1.30.1
          advanced-security: false
          annotations: true

  release-bookkeeping:
    name: Release bookkeeping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # manifest.json "version" must have a non-empty CHANGELOG.md section, so a
      # release commit that forgets one of the two fails here, not at tag time.
      - name: manifest.json version and CHANGELOG.md agree
        run: python3 scripts/release_check.py

  release:
    name: Release (a new version on main)
    # Only when every job above has succeeded on a push to main; release.yml skips a version that already has a tag.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ruff, mypy, tests, hassfest, hacs, compat-min, audit, secret-scan, workflow-lint, release-bookkeeping]
    permissions:
      contents: write
      checks: read
      actions: read
      id-token: write
    uses: ./.github/workflows/release.yml  # zizmor: ignore[self-repository] -- the "./" form is the long-standing one
