name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
          with:
            persist-credentials: false
        # Pinned to a commit of the default branch (the repository has no recent release).
        # The date is the commit date. The trailing comment is deliberately not a bare
        # branch name: zizmor's ref-version-mismatch audit fails as soon as that branch
        # moves past the pin. The wrapper starts the ghcr.io/home-assistant/hassfest
        # image, which this pin does not freeze.
        - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3  # master 2026-09-27