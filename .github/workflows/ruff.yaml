name: Ruff

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3.6.1
        with:
          # Pinned on purpose: ruff 0.16.0 raised the default rule set from 59 to
          # 413 rules, which turned this job red with no change to the code.
          # Bump the version deliberately, together with the rules in pyproject.toml.
          version: "0.17.1"
          args: check custom_components/ztm_warsaw
