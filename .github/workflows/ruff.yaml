name: Ruff

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          # Pinned on purpose: ruff 0.16.0 raised the default rule set from 59 to
          # 413 rules, which turned this job red with no change to the code.
          # Bump the version deliberately, together with the rules in pyproject.toml.
          version: "0.17.1"
          args: check custom_components/ztm_warsaw
